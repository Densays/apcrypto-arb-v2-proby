<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#0b0d10;color:#eef1f4;font-family:Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:700;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 35%,#13171c 0%,#0b0d1060%)}
.num,.price,.t-val,.big,.svc-r,.tl-t{font-variant-numeric:tabular-nums}
.stage{position:absolute;inset:0;padding:200px 60px 300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.stage.top{justify-content:flex-start}
.card{background:#14181d;border:1px solid #262c33;border-radius:18px;padding:36px;width:100%;position:relative}
.lbl{font-size:22px;color:#8a93a0;text-transform:uppercase;letter-spacing:.12em;font-weight:600;display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-size:64px;font-weight:800}
.big{font-size:160px;font-weight:800;line-height:1;letter-spacing:-.02em}
.h1{font-size:76px;font-weight:800;line-height:1.08;text-align:center;letter-spacing:-.01em}
.q{font-size:68px;font-weight:800;line-height:1.1;text-transform:uppercase;text-align:center}
/* coin */
.coin{position:relative;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0%,#e9c85a 18%,#d4af37 45%,#9c7a22 80%,#5e4712 100%);box-shadow:0 30px 80px rgba(212,175,55,.35),inset 0 -12px 30px rgba(0,0,0,.35),inset 0 10px 24px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex:none}
.coin-ring{position:absolute;border-radius:50%;border:3px solid rgba(255,240,180,.55);box-shadow:inset 0 0 0 6px rgba(90,65,15,.35)}
.coin-mark{display:flex;flex-direction:column;align-items:center;gap:4%;color:#5e4712;text-shadow:0 2px 0 rgba(255,245,200,.5)}
.coin-orb{border-radius:50%;border:5px solid #6a5218;position:relative;background:radial-gradient(circle at 40% 35%,#fff1b8,#c99c2e)}
.coin-orb:after{content:"";position:absolute;left:-30%;right:-30%;top:45%;height:14%;border:4px solid #6a5218;border-radius:50%;transform:rotate(-20deg)}
.coin-txt{font-weight:900;letter-spacing:.06em;font-size:.9em}
.stack{position:relative;width:260px;height:260px}
.stack-coin{position:absolute;left:0;width:260px;height:70px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#ffe9a0,#d4af37 55%,#8a6d1f);border:3px solid #7a5a14;box-shadow:0 10px 0 #7a5a14}
/* mosaic */
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:10px;padding:10px}
.tile{position:relative;overflow:hidden;filter:blur(7px);border-radius:12px}
.tile-t{position:absolute;left:40px;top:60px;font-size:120px;font-weight:900;color:#fff;opacity:.8}
.tile-s{position:absolute;left:44px;top:200px;font-size:48px;color:#fff;opacity:.6}
.tile-blob{position:absolute;right:40px;bottom:60px;width:260px;height:140px;border-radius:60px 60px 20px 20px;background:rgba(255,255,255,.25)}
.tile-bar{position:absolute;left:40px;bottom:50px;width:360px;height:30px;border-radius:15px;background:rgba(255,255,255,.3)}
.stamp-scam{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);border:14px solid #e5484d;color:#e5484d;font-size:300px;font-weight:900;padding:10px 60px;border-radius:30px;letter-spacing:.04em;background:rgba(11,13,16,.35);box-shadow:0 0 80px rgba(229,72,77,.35)}
/* exchange */
.xh{width:100%;background:#14181d;border:1px solid #262c33;border-radius:18px;padding:22px 32px;display:flex;justify-content:space-between;align-items:center}
.xh-l{display:flex;align-items:center;gap:22px}
.xh-t{font-size:30px;letter-spacing:.1em;color:#8a93a0;font-weight:700}.xh-t span{color:#eef1f4}
.tabs{display:flex;gap:10px;background:#0b0d10;border-radius:12px;padding:6px}
.tab{padding:14px 26px;border-radius:9px;font-size:24px;color:#8a93a0;letter-spacing:.08em}
.tab.on{background:#2ee6a622;color:#2ee6a6}.tab.on-o{background:#f0a03022;color:#f0a030}
.panel{display:flex;flex-direction:column}
.panel-body{flex:1;min-height:0;margin-top:24px;display:flex;align-items:center;justify-content:center}
.neq{font-size:200px;font-weight:800;color:#f5e400;line-height:1;text-shadow:0 0 40px rgba(245,228,0,.5)}
/* checklist */
.chk{display:flex;flex-direction:column;gap:22px}
.chk-row{display:flex;align-items:center;gap:28px;border:1px solid #262c33;border-radius:14px;padding:22px 28px;min-height:110px}
.chk-n{width:62px;height:62px;border-radius:50%;border:2px solid #8a93a0;color:#8a93a0;font-size:32px;display:flex;align-items:center;justify-content:center;flex:none}
.chk-t{font-size:40px;font-weight:700}
.chk-row.done{border-color:#2ee6a688}.chk-row.done .chk-n{background:#2ee6a6;border-color:#2ee6a6;color:#06281c}
/* tradingview */
.tv{position:relative;width:100%;background:#131722;border:1px solid #2a2e39;border-radius:18px;overflow:hidden}
.tv-bar{height:96px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #2a2e39}
.tv-search{flex:1;height:60px;border-radius:10px;background:#1e222d;display:flex;align-items:center;gap:14px;padding:0 20px;font-size:28px;color:#8a93a0;font-weight:600;border:1px solid #2a2e39;white-space:nowrap;overflow:hidden}
.tv-search.filled{color:#fff;border-color:#f5e400;box-shadow:0 0 0 2px #f5e40066}
.tv-search.s2{border-color:#f0a030;box-shadow:0 0 0 2px #f0a03066}
.tv-cmp{height:60px;padding:0 24px;display:flex;align-items:center;border-radius:10px;border:4px solid #f5e400;color:#f5e400;font-size:28px;white-space:nowrap;box-shadow:0 0 30px rgba(245,228,0,.4)}
.tv-sugg{display:flex;gap:28px;padding:16px 118px;font-size:22px;color:#8a93a0;font-weight:600;border-bottom:1px solid #2a2e39}
.tv-hint{position:absolute;right:24px;top:106px;background:#f5e400;color:#111;font-size:24px;padding:10px 18px;border-radius:10px;font-weight:800;z-index:2}
.tv-body{display:flex;height:620px}
.tv-tools{width:70px;border-right:1px solid #2a2e39;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:24px}
.tv-tools i{width:30px;height:30px;border-radius:7px;background:#2a2e39}
.tv-chart{flex:1;background-image:linear-gradient(#1c2030 1px,transparent 1px),linear-gradient(90deg,#1c2030 1px,transparent 1px);background-size:120px 120px;display:flex;align-items:center;justify-content:center;position:relative}
.cursor{position:absolute;z-index:5;filter:drop-shadow(0 4px 8px rgba(0,0,0,.7))}
.plate{background:#14181d;border:1px solid #262c33;border-radius:18px;padding:26px 48px;font-size:40px;letter-spacing:.06em;text-transform:uppercase}
.plate b{color:#f5e400}
/* ticket */
.ticket{display:flex;flex-direction:column;gap:22px;overflow:hidden}
.badge{font-size:24px;border:2px solid;border-radius:999px;padding:8px 20px;letter-spacing:.06em;text-transform:lowercase}
.t-title{font-size:56px;font-weight:800}
.t-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #262c33;padding-top:18px}
.t-val{font-size:52px;font-weight:800}
.t-btn{margin-top:8px;height:104px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;letter-spacing:.08em}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:8px solid #e5484d;color:#e5484d;font-size:96px;font-weight:900;padding:6px 36px;border-radius:18px;background:rgba(11,13,16,.6);letter-spacing:.06em}
.arrow-sim{display:flex;align-items:center;gap:22px;color:#f5e400;font-size:34px;letter-spacing:.08em;text-transform:uppercase}
.arrow-sim svg{flex:none}
/* misc */
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:14px 30px;font-size:36px;font-weight:800;border:2px solid}
.tl{width:100%;position:relative;height:200px}
.tl-line{position:absolute;left:0;right:0;top:100px;height:6px;background:#262c33;border-radius:3px}
.tl-t{position:absolute;top:130px;font-size:26px;color:#8a93a0;transform:translateX(-50%)}
.tl-w{position:absolute;top:70px;width:44px;height:66px;border-radius:10px;background:#f5e400;box-shadow:0 0 30px rgba(245,228,0,.6);transform:translateX(-50%)}
.tl-wl{position:absolute;top:10px;font-size:24px;color:#f5e400;letter-spacing:.1em;text-transform:uppercase;transform:translateX(-50%)}
.ex{display:flex;align-items:center;gap:30px;background:#14181d;border:1px solid #262c33;border-radius:18px;padding:26px 36px;width:100%}
.ex-logo{width:84px;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#111;flex:none}
.ex-n{font-size:52px;font-weight:800}
.spec{display:flex;flex-direction:column;gap:18px}
.spec-row{display:flex;align-items:center;gap:26px;font-size:44px;font-weight:700;padding:14px 0;border-top:1px solid #262c33}
.spec-row:first-of-type{border-top:0}
.cb{width:56px;height:56px;border-radius:12px;background:#2ee6a6;color:#06281c;display:flex;align-items:center;justify-content:center;font-size:38px;flex:none}
.svc{background:#0b0d10;border:1px solid #262c33;border-radius:14px;overflow:hidden;width:100%}
.svc-r{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;padding:18px 24px;font-size:30px;border-top:1px solid #262c33}
.svc-r.h{font-size:20px;color:#8a93a0;text-transform:uppercase;letter-spacing:.1em;border-top:0;background:#14181d}
.svc-r .sp{color:#8a93a0}
.svc-r.hl{background:#2ee6a622;color:#2ee6a6;outline:2px solid #2ee6a6;outline-offset:-2px}.svc-r.hl .sp{color:#2ee6a6;font-weight:900}
.mini{background:#14181d;border:1px solid #262c33;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;width:100%}
.mini .lbl{justify-content:center}
.profile{position:relative;width:900px;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.profile img{display:block;width:900px}
.pframe{position:absolute;border:4px solid #f5e400;border-radius:12px}
.pframe.glow{box-shadow:0 0 0 6px rgba(245,228,0,.35),0 0 50px rgba(245,228,0,.8);border-width:5px}
.tg-row{display:flex;align-items:center;gap:26px;font-size:46px;font-weight:700;border-top:1px solid #262c33;padding:26px 0}
.tg-row .b{width:18px;height:18px;border-radius:50%;background:#f5e400;flex:none}
.sub{font-size:30px;color:#8a93a0;font-weight:600;letter-spacing:.04em}
