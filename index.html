function show(i){idx=i;const x=D[cur][i];document.getElementById('big').src=x.f;document.getElementById('meta').textContent=`${x.sc} · кадр ${x.n} · ${x.t.toFixed(2)}–${x.end.toFixed(2)} с`;
document.getElementById('say').textContent='«'+x.say+'»';document.getElementById('must').textContent=x.must?('что показывает кадр: '+x.must):'';document.querySelectorAll('.strip div').forEach((e,j)=>e.classList.toggle('on',j==i))}
function go(i,s){show(i);if(s){a.currentTime=D[cur][i].t;a.play()}}function setDir(k){cur=k;dirs();strip();go(0,false);a.currentTime=D[cur][0].t}
a.addEventListener('timeupdate',()=>{const t=a.currentTime,F=D[cur];let j=0;for(let i=0;i<F.length;i++)if(F[i].t<=t+0.02)j=i;if(j!=idx)show(j)});
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(Math.min(idx+1,D[cur].length-1),true);if(e.key=='ArrowLeft')go(Math.max(idx-1,0),true)});setDir(cur);</script>
